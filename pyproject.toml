[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "textbooks-to-rl"
version = "0.1.0"
description = "A tool for generating reinforcement learning training questions from textbooks"
authors = [
    {name = "Toby Simonds", email = "toby@example.com"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["machine learning", "textbook", "question generation", "reinforcement learning"]

dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "aiohttp>=3.8.0",
    "requests>=2.25.0",
    "tqdm>=4.65.0",
    "PyPDF2>=3.0.0",
    "pyarrow>=14.0.0",
    "datasets>=2.14.0",
    "sympy>=1.12.0",
    "pymupdf>=1.22.0",
    "typing-extensions>=4.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/tobysimonds/textbooks-to-rl"
Repository = "https://github.com/tobysimonds/textbooks-to-rl"

[project.scripts]
textbooks-to-rl = "textbooks_to_rl.cli:cli_main"

[tool.hatch.build.targets.wheel]
packages = ["src/textbooks_to_rl"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "B905", # zip without an explicit strict parameter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "PyPDF2.*",
    "fitz.*",
    "sympy.*",
    "datasets.*",
    "openai.*",
    "anthropic.*",
]
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.10",
]
